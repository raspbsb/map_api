<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>쿠키 삭제</title>
  </head>
  <body>
    <h1>쿠키 삭제</h1>
    <pre>
      쿠키 삭제 : 똑같은 이름의 쿠키를 만기일을 과거로 지정해 생성
    </pre>
    <script>
      let today = new Date(); // 현재 시간
      today.setDate(today.getDate() - 1); // 1일 뒤 날짜 생성

      document.cookie = `MyFirstCookie=안녕; Expires=${today.toString()}`;
    </script>
  </body>
</html>
