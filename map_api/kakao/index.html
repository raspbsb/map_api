<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>카카오 지도</title>
    <style>
      .map {
        /* width: 100%; */
        height: 600px;
        border: 1px solid #ccc;
        border-radius: 10px;
      }
      h2,
      p {
        margin: 0;
      }
      .infoWindow {
        border: 1px solid #ccc;
        padding: 20px 35px;
        box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.15);
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 20px;
      }
      .infoWindow h2 {
        font-size: 16px;
      }
      .infoWindow p {
        font-size: 14px;
        white-space: nowrap;
      }
      .wrapper {
        display: grid;
        grid-template-columns: 1fr 2fr;
        padding: 40px;
        border: 1px solid #ccc8;
        gap: 40px;
      }
      .location {
        display: flex;
        flex-direction: column;
        gap: 12px;
        justify-content: space-between;
        margin: 0;
      }
      .location li {
        list-style: none;
        border: 1px solid #ccc8;
        display: flex;
        flex: 1 1 auto;
        justify-content: space-between;
        align-items: center;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 1px 1px rgba(0, 0, 0, 0.1);
      }
      .location li div {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .location li div .title {
        font-size: 24px;
        font-weight: 500;
      }
      .location li a {
        font-size: 16px;
        font-weight: 700;
        background: #f3f3f3;
        border: 1px solid #777;
        padding: 10px 20px;
        border-radius: 30px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <ul class="location">
        <!-- 각 li에는 지도 이동에 필요한 위도, 경도, 주소 정보를 data 속성으로 저장한다. -->
        <li
          data-lat="37.5665851"
          data-lng="126.9782038"
          data-address="서울특별시 중구 세종대로 110 (태평로1가)"
        >
          <div>
            <h2 class="title">서울시청</h2>
            <span>서울특별시 중구 세종대로 110 (태평로1가)</span>
          </div>
          <a> 위치 보기 </a>
        </li>
        <li
          data-lat="37.5175066"
          data-lng="127.0473753"
          data-address="서울특별시 강남구 학동로 426 (삼성동 16-1)"
        >
          <div>
            <h2 class="title">강남구청</h2>
            <span>서울특별시 강남구 학동로 426 (삼성동 16-1)</span>
          </div>
          <a> 위치 보기 </a>
        </li>
        <li
          data-lat="37.5323264"
          data-lng="126.9907031"
          data-address="서울특별시 용산구 녹사평대로 150 (이태원동)
"
        >
          <div>
            <h2 class="title">용산구청</h2>
            <span>서울특별시 용산구 녹사평대로 150 (이태원동)</span>
          </div>
          <a> 위치 보기 </a>
        </li>
        <li
          data-lat="37.6540782"
          data-lng="127.0566045"
          data-address="서울특별시 노원구 노해로 437 (상계동)"
        >
          <div>
            <h2 class="title">노원구청</h2>
            <span>서울특별시 노원구 노해로 437 (상계동)</span>
          </div>
          <a> 위치 보기 </a>
        </li>
      </ul>
      <!-- 지도를 표시할 div 입니다 -->
      <div id="map" class="map"></div>
    </div>

    <script
      type="text/javascript"
      src="//dapi.kakao.com/v2/maps/sdk.js?appkey=d2f0d752e2c949b896e494c3d87ee545"
    ></script>

    <script>
      // 위치 목록의 li 요소들을 모두 가져온다.
      const locations = document.querySelectorAll(".location li");
      // 각 li를 클릭하면 각 변수를 가져와서 대입

      // 각 위치 항목 안의 링크를 클릭하면 해당 li의 data 값을 읽어 지도를 다시 그린다.
      locations.forEach(location => {
        // 현재 반복 중인 li 안에서만 a 태그를 찾는다.
        const link = location.querySelector("a");

        link.addEventListener("click", event => {
          // a 태그의 기본 이동 동작을 막고, 지도 변경만 실행한다.
          event.preventDefault();

          // 부모 li에 저장된 data-lat, data-lng, data-address 값을 가져온다.
          let lat = Number(location.dataset.lat);
          let lng = Number(location.dataset.lng);
          let address = location.dataset.address;
          // 화면에 표시된 장소명을 인포윈도우 제목으로 사용한다.
          let title = location.querySelector(".title").innerText;

          myMap(lat, lng, title, address);
        });
      });

      // 전달받은 좌표와 장소 정보를 기준으로 카카오 지도를 생성하고 인포윈도우를 표시한다.
      function myMap(lat, lng, title, address) {
        var mapContainer = document.getElementById("map"), // 지도를 표시할 div
          mapOption = {
            center: new kakao.maps.LatLng(lat, lng), // 지도의 중심좌표
            level: 5, // 지도의 확대 레벨
          };

        var map = new kakao.maps.Map(mapContainer, mapOption); // 지도를 생성합니다

        // 인포윈도우에 들어갈 HTML과 표시 위치를 설정한다.
        var iwContent = `
          <div class="infoWindow">
            <h2>${title}</h2>
            <p>${address}</p>
          </div>`,
          // 인포윈도우에 표출될 내용으로 HTML 문자열이나 document element가 가능합니다
          iwPosition = new kakao.maps.LatLng(lat, lng), //인포윈도우 표시 위치입니다
          iwRemoveable = true; // removeable 속성을 ture 로 설정하면 인포윈도우를 닫을 수 있는 x버튼이 표시됩니다

        // 인포윈도우를 생성하고 지도에 표시합니다
        var infowindow = new kakao.maps.InfoWindow({
          map: map, // 인포윈도우가 표시될 지도
          position: iwPosition,
          content: iwContent,
          removable: iwRemoveable,
        });
      }
      myMap(37.5665851, 126.9782038, `서울시청`, `서울특별시 중구 세종대로 110 (태평로1가)`);
    </script>
  </body>
</html>
